<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVAMP Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--vscode-foreground);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      color: white;
      margin-bottom: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 48px;
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .header p {
      font-size: 18px;
      opacity: 0.9;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon {
      font-size: 24px;
    }

    .project-list {
      list-style: none;
    }

    .project-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .project-item:hover {
      background: #efefef;
      transform: translateX(5px);
    }

    .project-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .project-meta {
      font-size: 12px;
      color: #666;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
    }

    .status-draft {
      background: #e0e0e0;
      color: #666;
    }

    .status-active {
      background: #c8e6c9;
      color: #2e7d32;
    }

    .status-completed {
      background: #b3e5fc;
      color: #01579b;
    }

    .pipeline-stages {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px;
    }

    .stage {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      background: #f5f5f5;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #999;
      transition: all 0.2s;
    }

    .stage.active {
      background: #667eea;
      color: white;
      transform: scale(1.05);
    }

    .stage.completed {
      background: #4caf50;
      color: white;
    }

    .button {
      display: inline-block;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      margin-top: 16px;
      width: 100%;
    }

    .button:hover {
      background: #764ba2;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: white;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 32px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>REVAMP</h1>
      <p>AI-Powered Legacy Code Modernization</p>
    </div>

    <div class="dashboard-grid">
      <!-- Projects Card -->
      <div class="card">
        <h2><span class="card-icon">📁</span> Projects</h2>
        <ul class="project-list" id="projects-list">
          <li style="text-align: center; color: #999; padding: 20px;">Loading...</li>
        </ul>
      </div>

      <!-- Stats Card -->
      <div class="card">
        <h2><span class="card-icon">📊</span> Statistics</h2>
        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="stat-projects">0</div>
            <div class="stat-label">Projects</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-pipelines">0</div>
            <div class="stat-label">Pipelines</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-lines">0</div>
            <div class="stat-label">Lines Analyzed</div>
          </div>
        </div>
      </div>

      <!-- Quick Actions Card -->
      <div class="card">
        <h2><span class="card-icon">⚡</span> Quick Actions</h2>
        <button class="button" onclick="createNewProject()">New Project</button>
        <button class="button" onclick="analyzeCurrent()">Analyze Code</button>
        <button class="button" onclick="modernizeCode()">Modernize</button>
      </div>
    </div>

    <!-- Pipeline Monitor -->
    <div class="card">
      <h2><span class="card-icon">🔄</span> Pipeline Monitor</h2>
      <div id="pipeline-monitor">
        <div class="empty-state">
          <div class="empty-state-icon">⏸️</div>
          <p>No active pipeline</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function loadDashboard() {
      // Fetch projects and update UI
      console.log('Dashboard loaded');
      updateStats();
    }

    function updateStats() {
      document.getElementById('stat-projects').textContent = '12';
      document.getElementById('stat-pipelines').textContent = '8';
      document.getElementById('stat-lines').textContent = '45K';
    }

    function createNewProject() {
      console.log('Create new project');
    }

    function analyzeCurrent() {
      console.log('Analyze current code');
    }

    function modernizeCode() {
      console.log('Modernize code');
    }

    loadDashboard();
  </script>
</body>
</html>
