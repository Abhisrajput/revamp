[package]
name = "bree-engine"
version = "0.1.0"
edition = "2021"
description = "BREE Language Support Engine — plugin-based legacy language detection, parsing, and analysis"
license = "MIT"

[dependencies]
# HTTP framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "timeout", "limit"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dotenvy = "0.15"
envy = "0.4"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Error handling
thiserror = "1"
anyhow = "1"

# Parallel processing
rayon = "1.10"

# SSE streaming
tokio-stream = "0.1"
futures-util = "0.3"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
regex = "1"

[[bin]]
name = "bree-engine"
path = "src/main.rs"
