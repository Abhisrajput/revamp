version: '3.9'

services:
  # PostgreSQL Database (HA configuration with streaming replication)
  postgres-primary:
    image: postgres:16-alpine
    container_name: revamp-postgres-primary
    environment:
      POSTGRES_USER: ${DB_USER:-revamp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: revamp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      POSTGRES_REPLICATION_MODE: master
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-primary.conf:/etc/postgresql/postgresql.conf
      - ./init-scripts/pg_hba.conf:/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revamp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Redis Sentinel (HA)
  redis-primary:
    image: redis:7-alpine
    container_name: revamp-redis-primary
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_primary_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis-replica:
    image: redis:7-alpine
    container_name: revamp-redis-replica
    command: redis-server --port 6380 --replicaof redis-primary 6379 --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_replica_data:/data
    depends_on:
      - redis-primary
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # MinIO with SSL
  minio:
    image: minio/minio:latest
    container_name: revamp-minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_SERVER_URL: https://${MINIO_DOMAIN}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
      - ./certs:/certs
    command: minio server /minio_data --console-address ":9001" --certs-dir /certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # API Gateway (Fastify) - Multiple instances behind load balancer
  api-1:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/Dockerfile.api
    # Note: container_name removed — incompatible with deploy.replicas > 1
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-revamp}:${DB_PASSWORD}@postgres-primary:5432/revamp
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-primary:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: revamp
      MINIO_USE_SSL: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY is required}
      AGENT_WORKER_URL: http://agent-worker:9090
      LOG_LEVEL: info
      NODE_OPTIONS: "--max-old-space-size=2048"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s

  # Web Application (Next.js) - Static export with CDN in front
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${API_DOMAIN}
    container_name: revamp-web-prod
    environment:
      NODE_ENV: production
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Agent Worker (Go service — sandbox, LSP, tool execution)
  agent-worker:
    build:
      context: ../../services/agent-worker
      dockerfile: Dockerfile
    container_name: revamp-agent-worker-prod
    environment:
      PORT: 9090
      ENV: production
      DATABASE_URL: postgresql://${DB_USER:-revamp}:${DB_PASSWORD}@postgres-primary:5432/revamp
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-primary:6379
      LOG_LEVEL: info
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: revamp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api-1
      - web
      - agent-worker
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ─── Database Backup CronJob ────────────────────────────────────
  # Runs pg_dump daily at 2 AM and uploads to MinIO (S3-compatible).
  # Keeps 30 days of backups. Restore: pg_restore -d revamp < backup.dump
  db-backup:
    image: postgres:16-alpine
    container_name: revamp-db-backup
    environment:
      PGHOST: postgres-primary
      PGUSER: ${DB_USER:-revamp}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: revamp
      BACKUP_BUCKET: revamp-backups
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl && \
        while true; do
          echo "[backup] Starting database backup at $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BACKUP_FILE="/tmp/revamp-$$(date +%Y%m%d-%H%M%S).dump"
          pg_dump -Fc --no-owner --no-privileges > "$$BACKUP_FILE" 2>/dev/null
          if [ $$? -eq 0 ]; then
            SIZE=$$(stat -f%z "$$BACKUP_FILE" 2>/dev/null || stat -c%s "$$BACKUP_FILE")
            echo "[backup] Dump complete: $$SIZE bytes"
            # Upload to MinIO using curl (no mc client needed)
            DATE=$$(date -u +%Y%m%d)
            curl -s -X PUT \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$$BACKUP_FILE" \
              "$$MINIO_ENDPOINT/$$BACKUP_BUCKET/daily/$$DATE/$$(basename $$BACKUP_FILE)" \
              -u "$$MINIO_ACCESS_KEY:$$MINIO_SECRET_KEY" && \
              echo "[backup] Uploaded to MinIO: daily/$$DATE/$$(basename $$BACKUP_FILE)" || \
              echo "[backup] ERROR: Upload to MinIO failed"
            rm -f "$$BACKUP_FILE"
          else
            echo "[backup] ERROR: pg_dump failed"
          fi
          # Sleep until 2 AM next day (86400 seconds = 24 hours)
          echo "[backup] Next backup in 24 hours"
          sleep 86400
        done
    depends_on:
      postgres-primary:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - revamp-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_primary_data:
    driver: local
  redis_primary_data:
    driver: local
  redis_replica_data:
    driver: local
  minio_data:
    driver: local

networks:
  revamp-network:
    driver: bridge
