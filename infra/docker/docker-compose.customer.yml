# REVAMP Customer Distribution Bundle
#
# One-command installation for customer self-hosted deployments.
# Usage:
#   1. Copy this directory + the .env.example file
#   2. cp .env.example .env and edit the CHANGE_ME values
#   3. docker compose -f docker-compose.customer.yml up -d
#   4. Watch `docker logs revamp-api` for the [SETUP] bootstrap token line
#   5. Visit http://<host>/setup and paste the token to complete installation
#
# See docs/install/customer-install.md for full instructions (Task 23).

version: '3.9'

services:
  # ─── Keycloak Postgres ───────────────────────────────────────────────────────
  # Isolated from the main revamp DB — Keycloak data must never share a Postgres
  # instance with application data in production deployments.
  keycloak-db:
    image: postgres:16.6-alpine
    container_name: revamp-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - revamp

  # ─── Keycloak Identity Provider ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: revamp-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      # Hostname must resolve from the customer's browser to this host.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set in .env}
    command: ["start", "--import-realm"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    # Port 8080 is intentionally NOT exposed externally here; the nginx reverse
    # proxy below routes /auth/* to keycloak:8080. Uncomment to expose directly:
    # ports:
    #   - "8080:8080"
    healthcheck:
      # Keycloak 25 image has no curl/wget — probe via bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - revamp

  # ─── Application Postgres ────────────────────────────────────────────────────
  postgres:
    image: postgres:16.6-alpine
    container_name: revamp-postgres
    environment:
      POSTGRES_USER: revamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in .env}
      POSTGRES_DB: revamp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revamp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - revamp

  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: revamp-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - revamp

  # ─── MinIO Object Storage (S3-compatible) ────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: revamp-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set in .env}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - revamp

  # ─── REVAMP API Gateway (Fastify) ────────────────────────────────────────────
  revamp-api:
    image: revamp/api:${REVAMP_VERSION:-latest}
    container_name: revamp-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://revamp:${POSTGRES_PASSWORD:?Set in .env}@postgres:5432/revamp
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set in .env}
      MINIO_BUCKET: revamp
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set in .env}
      AGENT_WORKER_URL: http://revamp-agent-worker:9090
      # Keycloak OIDC config — points at the keycloak service defined above.
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/revamp
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/revamp/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: revamp-api
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      # Hard-coded: legacy JWT auth must remain off in customer deployments.
      LEGACY_AUTH_ENABLED: "false"
      # Optional LLM credentials — set at least one.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - revamp

  # ─── REVAMP Web Application (Next.js) ────────────────────────────────────────
  revamp-web:
    image: revamp/web:${REVAMP_VERSION:-latest}
    container_name: revamp-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost/api}
      NEXT_PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost/auth}
      NEXT_PUBLIC_KEYCLOAK_REALM: revamp
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: revamp-web
    depends_on:
      - revamp-api
    restart: unless-stopped
    networks:
      - revamp

  # ─── REVAMP Agent Worker (Go — sandbox, LSP, tool execution) ─────────────────
  revamp-agent-worker:
    image: revamp/agent-worker:${REVAMP_VERSION:-latest}
    container_name: revamp-agent-worker
    environment:
      PORT: 9090
      ENV: production
      DATABASE_URL: postgresql://revamp:${POSTGRES_PASSWORD:?Set in .env}@postgres:5432/revamp
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - revamp

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  # Single ingress point on port 80 (and optionally 443 with TLS termination).
  # Routes: / → revamp-web, /api → revamp-api, /auth → keycloak, /s3 → minio
  nginx:
    image: nginx:1.27-alpine
    container_name: revamp-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment for TLS; mount certs and adjust nginx.conf accordingly:
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - revamp-api
      - revamp-web
      - keycloak
    restart: unless-stopped
    networks:
      - revamp

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  keycloak_db_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ─── Network ──────────────────────────────────────────────────────────────────
# Single flat network; all services are internal except what nginx exposes.
networks:
  revamp:
    driver: bridge
