# PostgreSQL 16 production configuration for REVAMP platform
# Tuned for a modernization workload: large text columns (stage outputs),
# heavy JSONB usage (stage_progress, config), moderate concurrency.

# Connection Settings
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# Memory
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 256MB

# WAL & Replication
wal_level = replica
max_wal_senders = 5
wal_keep_size = 512MB
hot_standby = on
synchronous_commit = on

# WAL Archiving — enables point-in-time recovery (PITR)
# Archive WAL segments to /var/lib/postgresql/wal_archive/
# In production, use archive_command to push to S3 or external storage.
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300

# Write Performance
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB

# Query Planning
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 0

# Autovacuum
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Timeouts
statement_timeout = 60000
idle_in_transaction_session_timeout = 300000
