worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Upstream targets (compose service names)
    upstream revamp_web   { server revamp-web:3000; }
    upstream revamp_kc    { server keycloak:8080; }

    # HTTP → HTTPS redirect + ACME challenge
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: REVAMP web + Keycloak under /auth
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/PUBLIC_HOST_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/PUBLIC_HOST_PLACEHOLDER/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Keycloak at /auth — rewrite strips the prefix on the way out so
        # Keycloak itself sees paths like /realms/... (matching KC_HOSTNAME path).
        location /auth/ {
            proxy_pass         http://revamp_kc/;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  https;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   X-Forwarded-Port   443;
        }

        # Everything else → Next.js web
        location / {
            proxy_pass         http://revamp_web;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  https;
        }
    }
}
