worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    upstream revamp_web { server revamp-web:3000; }
    upstream revamp_kc  { server keycloak:8080; }

    # Reusable proxy config, shared between HTTP and HTTPS server blocks.
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Plain HTTP — still useful for health checks and for environments where
    # the browser hasn't been force-upgraded to HTTPS yet.
    server {
        listen 80;
        server_name _;

        # Keycloak at /kc/* — we do NOT strip the prefix because Keycloak is
        # configured with KC_HTTP_RELATIVE_PATH=/kc so it expects its own paths
        # to start with /kc. This also frees /auth/* for the Next.js web app's
        # own OIDC flow routes (/auth/login, /auth/callback, /auth/logout).
        location /kc/ {
            proxy_pass         http://revamp_kc;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   X-Forwarded-Port   $server_port;
        }

        location / {
            proxy_pass         http://revamp_web;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
        }
    }

    # HTTPS with self-signed cert. Chrome will show a "Not secure" warning on
    # first visit — users click "Advanced → Proceed". Necessary because Chrome
    # auto-upgrades typed URLs to https:// and most corporate proxies (Netskope
    # et al.) strip or block plain HTTP to bare IPs.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /kc/ {
            proxy_pass         http://revamp_kc;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  https;
            proxy_set_header   X-Forwarded-Host   $host;
            proxy_set_header   X-Forwarded-Port   443;
        }

        location / {
            proxy_pass         http://revamp_web;
            proxy_http_version 1.1;
            proxy_set_header   Host               $host;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  https;
        }
    }
}
