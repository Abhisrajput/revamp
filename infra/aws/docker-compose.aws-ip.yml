# REVAMP AWS Deployment Bundle — HTTP-only / IP-addressed variant
#
# For the quick-demo case where you run this ON an existing EC2 instance
# and access it via the public IP (no DNS, no TLS). Use docker-compose.aws.yml
# for the production-style domain + Let's Encrypt flow.
#
# Start: ./setup-on-host.sh  (wraps `docker compose ... up -d --build`)

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: revamp-postgres
    environment:
      POSTGRES_USER: revamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: revamp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revamp -d revamp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [revamp]
    restart: unless-stopped

  keycloak-db:
    image: postgres:16.6-alpine
    container_name: revamp-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [revamp]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: revamp-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: ${PUBLIC_HOST:?}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    command: ["start-dev", "--import-realm"]
    volumes:
      - ../docker/keycloak:/opt/keycloak/data/import:ro
      - ../docker/keycloak/themes/revamp:/opt/keycloak/themes/revamp:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [revamp]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: revamp-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [revamp]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: revamp-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [revamp]
    restart: unless-stopped

  revamp-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: revamp-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://revamp:${POSTGRES_PASSWORD}@postgres:5432/revamp
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?}
      # NOTE: http:// (not https://) because this is the IP-based demo bundle.
      KEYCLOAK_ISSUER: http://${PUBLIC_HOST}/auth/realms/revamp
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/revamp/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: revamp-web,revamp-vscode
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      LEGACY_AUTH_ENABLED: "false"
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: revamp
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    networks: [revamp]
    restart: unless-stopped

  revamp-web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: revamp-web
    depends_on: [revamp-api]
    environment:
      # IP-demo runs without TLS — session cookie's Secure flag is OFF via
      # the dedicated env var (NODE_ENV stays `production` so other optimisations
      # still apply). Add TLS later via setup-on-host-tls.sh or move to
      # docker-compose.aws.yml with a domain.
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "false"
      NEXT_PUBLIC_APP_URL: http://${PUBLIC_HOST}
      KEYCLOAK_ISSUER: http://${PUBLIC_HOST}/auth/realms/revamp
      KEYCLOAK_CLIENT_ID: revamp-web
      FASTIFY_INTERNAL_URL: http://revamp-api:8787
      SESSION_SECRET: ${SESSION_SECRET:?}
    networks: [revamp]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: revamp-nginx
    depends_on: [revamp-web, keycloak]
    volumes:
      - ./nginx-http.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks: [revamp]
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_db_data:
  redis_data:
  minio_data:

networks:
  revamp:
    driver: bridge
